---
name: Build - Linux AppImage
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Cache keys
        id: setup
        run: |
          echo "image=${ImageOS}" >> "${GITHUB_OUTPUT}"
          echo "deps=${{ hashFiles('scripts/appimage-deps.sh', 'app/deploy/linux/appimage/*.patch') }}" >> "${GITHUB_OUTPUT}"

      # Downloaded .deb files only: apt still resolves versions as usual and fetches
      # anything newer than what the cache holds.
      - name: Restore apt download cache
        id: apt-cache
        uses: actions/cache/restore@v5
        with:
          path: apt-debs
          key: appimage-apt-v3-${{ steps.setup.outputs.image }}-${{ steps.setup.outputs.deps }}
          restore-keys: |
            appimage-apt-v3-${{ steps.setup.outputs.image }}-
            appimage-apt-v2-${{ steps.setup.outputs.image }}-

      - name: Setup environment
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloads
          scripts/appimage-deps.sh setup apt-debs
          # ccache is only used for Moonlight itself, so it stays out of the dependency script
          sudo apt install -y ccache
          cp /var/cache/apt/archives/ccache_*.deb /var/cache/apt/archives/libhiredis*.deb apt-debs/
          mkdir -p dep_root/{bin,include,lib}
          echo "DEP_ROOT=$PWD/dep_root" >> "${GITHUB_ENV}"
          echo "$PWD/dep_root/bin" >> "${GITHUB_PATH}"

      - name: Save apt download cache
        if: steps.apt-cache.outputs.cache-hit != 'true' && hashFiles('apt-debs/*.deb') != ''
        uses: actions/cache/save@v5
        with:
          path: apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # The libraries below only change when scripts/appimage-deps.sh or the libplacebo
      # patches do, so their installed files are cached and reused across runs.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: deps-stage
          key: appimage-deps-v1-${{ steps.setup.outputs.image }}-${{ steps.setup.outputs.deps }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/appimage-deps.sh build deps-stage

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: deps-stage
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Install cached dependencies
        if: steps.deps-cache.outputs.cache-hit == 'true'
        run: scripts/appimage-deps.sh restore deps-stage

      # Compiler cache for Moonlight itself. Each branch keeps its own entry and starts
      # from the default branch's entry when it has none yet.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: appimage-${{ steps.setup.outputs.image }}-${{ github.ref_name }}
          restore-keys: |
            appimage-${{ steps.setup.outputs.image }}-${{ github.ref_name }}
            appimage-${{ steps.setup.outputs.image }}-${{ github.event.repository.default_branch }}
          create-symlink: true
          max-size: 500M
          evict-old-files: job

      - name: Install linuxdeploy
        working-directory: dep_root/bin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Test stream policies
        run: |
          python3 tests/deckspatial_test.py
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/speakersafety_test.c -lm -o /tmp/speakersafety-test
          /tmp/speakersafety-test
          sudo ldconfig
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Itests/deckmicrophone_stubs -Iapp \
            tests/deckmicrophone_test.cpp app/streaming/deckmicrophone.cpp \
            -lopus -o /tmp/deckmicrophone-test
          /tmp/deckmicrophone-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            app/streaming/lifecycle/recoverypolicy.cpp \
            app/streaming/lifecycle/recoverysettings.cpp \
            tests/recoverypolicy_test.cpp \
            -o /tmp/recoverypolicy-test
          /tmp/recoverypolicy-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            tests/adaptivebuffer_test.cpp -o /tmp/adaptivebuffer-test
          /tmp/adaptivebuffer-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tests/lowlatency_test.cpp -o /tmp/lowlatency-test
          /tmp/lowlatency-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tests/fifodepth_test.cpp -o /tmp/fifodepth-test
          /tmp/fifodepth-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/fifotrim_test.cpp -o /tmp/fifotrim-test
          /tmp/fifotrim-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/fifodepthctl_test.cpp -o /tmp/fifodepthctl-test
          /tmp/fifodepthctl-test
          mkdir -p /tmp/sdlaudio-build
          pushd /tmp/sdlaudio-build
          qmake6 "$GITHUB_WORKSPACE/tests/sdlaudio_test.pro"
          make -j2
          ./sdlaudio-test
          popd
          c++ -std=c++17 -Wall -Wextra -Werror \
            tests/deckprotocol_test.cpp \
            -o /tmp/deckprotocol-test
            /tmp/deckprotocol-test
            c++ -std=c++17 -Wall -Wextra -Werror \
              tests/sourcetimeline_test.cpp -o /tmp/sourcetimeline-test
            /tmp/sourcetimeline-test

      - name: Build Binaries
        run: |
          sudo ldconfig
          scripts/build-appimage.sh

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-${{ env.CI_VERSION }}
          path: build/installer-release/Moonlight-${{ env.CI_VERSION }}-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
